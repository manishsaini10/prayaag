version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prayaag_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: prayaag_cms
      DB_USERNAME: prayaag_user
      DB_PASSWORD: prayaag_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: prayaag_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: prayaag_cms
      MYSQL_USER: prayaag_user
      MYSQL_PASSWORD: prayaag_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  redis:
    image: redis:7.0-alpine
    container_name: prayaag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  dbdata:
